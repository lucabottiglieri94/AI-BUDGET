<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spesa settimanale</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top left,#17152e 0,#0b1020 45%,#070b15 100%);color:#f1f3fa;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.top{display:flex;justify-content:space-between;align-items:center;padding:20px 28px;border-bottom:1px solid #293247;background:#111728cc;gap:15px;flex-wrap:wrap}.title{font-size:24px;font-weight:800}.sub{font-size:13px;color:#aeb6c9;margin-top:7px}.back,.weekbtn{border:1px solid #39445b;background:#202a3b;color:#eef2fb;padding:11px 16px;border-radius:12px;font-weight:700;cursor:pointer}.weeknav{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.weeklabel{min-width:190px;text-align:center;font-weight:800;background:#171f31;border:1px solid #39445b;padding:11px 14px;border-radius:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;padding:18px}.category{background:#0e1626;border:1px solid #2b354b;border-radius:20px;padding:12px 12px 16px}.cathead{display:flex;justify-content:space-between;align-items:center;padding:8px 6px 14px;font-weight:800}.muted{font-size:12px;color:#aeb6c9}.period{background:#1a2234;border:1px solid #354057;border-radius:16px;padding:16px;margin-top:14px}.phead{display:flex;justify-content:space-between;align-items:center;font-weight:800;margin-bottom:14px}.total{font-size:13px;color:#b9c1d2}.products{display:flex;flex-direction:column;gap:8px}.row{display:grid;grid-template-columns:1fr 125px 42px;gap:8px}.row input{width:100%;border:1px solid #46526b;background:#111827;color:#f5f5f5;border-radius:10px;padding:11px;font:inherit;font-size:14px;outline:none}.row input::placeholder{color:#8f99ad}.row input:focus{border-color:#8b5cf6;box-shadow:0 0 0 2px #8b5cf633;background:#171f31}.del{border:0;border-radius:10px;background:#ef4444;color:white;font-size:18px;cursor:pointer}.add{width:100%;margin-top:12px;border:0;border-radius:14px;padding:14px;background:linear-gradient(100deg,#20c96a,#2eb8ef);color:#08111c;font-weight:800;font-size:16px;cursor:pointer}.animal .add{background:linear-gradient(100deg,#f13f4c,#8c35ed)}.status{text-align:center;color:#aeb6c9;font-size:12px;padding:0 0 14px}.status.ok{color:#37d98b}.status.err{color:#ff7186}@media(max-width:800px){.grid{grid-template-columns:1fr}.top{padding:16px}.title{font-size:20px}.weeklabel{min-width:150px;font-size:12px}}
</style>
</head>
<body>
<header class="top"><div><div class="title">🛒 Spesa settimanale</div><div class="sub">Ogni settimana ha i suoi dati. Usa le frecce per cambiare settimana.</div></div><div class="weeknav"><button class="weekbtn" id="prevWeek">←</button><div class="weeklabel" id="weekLabel">Settimana corrente</div><button class="weekbtn" id="nextWeek">→</button><button class="weekbtn" id="todayWeek">Oggi</button><button class="back" onclick="location.href='index.html'">← Home</button></div></header>
<div id="status" class="status">Connessione a Firebase in corso...</div>
<main class="grid">
<section class="category"><div class="cathead"><span>🧑‍🤝‍🧑 Luca e Lisa</span><span class="muted">Spese alimentari</span></div><div class="period"><div class="phead"><span>🗓️ Lunedì–Giovedì</span><span class="total" id="foodTotal1">€ 0,00</span></div><div class="products" id="food1"></div><button class="add" onclick="addProduct('food1')">+ Aggiungi prodotto</button></div><div class="period"><div class="phead"><span>🗓️ Venerdì–Domenica</span><span class="total" id="foodTotal2">€ 0,00</span></div><div class="products" id="food2"></div><button class="add" onclick="addProduct('food2')">+ Aggiungi prodotto</button></div></section>
<section class="category animal"><div class="cathead"><span>🐈 Gatti</span><span class="muted">Spese animali</span></div><div class="period"><div class="phead"><span>🗓️ Lunedì–Giovedì</span><span class="total" id="petTotal1">€ 0,00</span></div><div class="products" id="pet1"></div><button class="add" onclick="addProduct('pet1')">+ Aggiungi prodotto</button></div><div class="period"><div class="phead"><span>🗓️ Venerdì–Domenica</span><span class="total" id="petTotal2">€ 0,00</span></div><div class="products" id="pet2"></div><button class="add" onclick="addProduct('pet2')">+ Aggiungi prodotto</button></div></section>
</main>
<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';import{getAuth,onAuthStateChanged}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';import{getFirestore,doc,onSnapshot,setDoc}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
const firebaseConfig={apiKey:'AIzaSyAdZbBv6JYbYnl6CxuFVfHhSftvIxwf2DY',authDomain:'budget-luca.firebaseapp.com',projectId:'budget-luca',storageBucket:'budget-luca.firebasestorage.app',messagingSenderId:'67496424698',appId:'1:67496424698:web:b1822e04ef4efc07408543',measurementId:'G-7LEYRZE9QN'};const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);let ref=null,timer=null,weekOffset=0,allWeeks={};const empty=()=>({food1:[],food2:[],pet1:[],pet2:[]});let state=empty();const statusEl=document.getElementById('status');const month=new Date().toISOString().slice(0,7);const money=n=>new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR'}).format(Number(n)||0);function setStatus(t,ok=false,err=false){statusEl.textContent=t;statusEl.className='status'+(ok?' ok':'')+(err?' err':'')}
function monday(d){const x=new Date(d);x.setHours(0,0,0,0);const day=x.getDay()||7;x.setDate(x.getDate()-day+1);return x}function keyFor(offset=0){const d=monday(new Date());d.setDate(d.getDate()+offset*7);return d.toISOString().slice(0,10)}function rangeLabel(key){const a=new Date(key+'T00:00:00');const b=new Date(a);b.setDate(a.getDate()+6);return a.toLocaleDateString('it-IT',{day:'2-digit',month:'2-digit',year:'numeric'})+' – '+b.toLocaleDateString('it-IT',{day:'2-digit',month:'2-digit',year:'numeric'})}function currentKey(){return keyFor(weekOffset)}function updateWeekLabel(){document.getElementById('weekLabel').textContent=(weekOffset===0?'Settimana corrente · ':'')+rangeLabel(currentKey())}
function clean(v){return String(v??'').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}function totalId(k){return k==='food1'?'foodTotal1':k==='food2'?'foodTotal2':k==='pet1'?'petTotal1':'petTotal2'}function render(k){const el=document.getElementById(k);el.innerHTML='';(state[k]||[]).forEach((p,i)=>{const row=document.createElement('div');row.className='row';row.innerHTML='<input class="pname" data-key="'+k+'" data-i="'+i+'" value="'+clean(p.name)+'" placeholder="Nome prodotto"><input class="pprice" type="number" min="0" step="0.01" data-key="'+k+'" data-i="'+i+'" value="'+(p.price??'')+'" placeholder="€ 0,00"><button class="del" data-key="'+k+'" data-i="'+i+'">×</button>';el.appendChild(row)});document.getElementById(totalId(k)).textContent=money((state[k]||[]).reduce((s,p)=>s+(Number(p.price)||0),0))}function renderAll(){['food1','food2','pet1','pet2'].forEach(render)}
function loadWeek(){state=JSON.parse(JSON.stringify(allWeeks[currentKey()]||empty()));updateWeekLabel();renderAll()}window.addProduct=k=>{state[k].push({name:'',price:''});renderAll();setTimeout(()=>document.querySelector('#'+k+' .pname:last-child')?.focus(),30)};document.addEventListener('input',e=>{if(!e.target.matches('.pname,.pprice'))return;const k=e.target.dataset.key,i=Number(e.target.dataset.i);if(!state[k][i])return;if(e.target.classList.contains('pname'))state[k][i].name=e.target.value;else state[k][i].price=e.target.value;updateTotal(k)});document.addEventListener('blur',e=>{if(e.target.matches('.pname,.pprice')){clearTimeout(timer);timer=setTimeout(save,180)}},true);document.addEventListener('click',e=>{if(!e.target.matches('.del'))return;const k=e.target.dataset.key,i=Number(e.target.dataset.i);state[k].splice(i,1);renderAll();save()});function updateTotal(k){document.getElementById(totalId(k)).textContent=money((state[k]||[]).reduce((s,p)=>s+(Number(p.price)||0),0))}
async function save(){if(!ref)return;allWeeks[currentKey()]=state;try{await setDoc(ref,{spesaSettimanale:{weeks:allWeeks,activeWeek:currentKey(),updatedAt:Date.now()}},{merge:true});setStatus('Salvato su Firebase ✓',true)}catch(e){setStatus('Errore nel salvataggio Firebase',false,true)}}document.getElementById('prevWeek').onclick=async()=>{await save();weekOffset--;loadWeek()};document.getElementById('nextWeek').onclick=async()=>{await save();weekOffset++;loadWeek()};document.getElementById('todayWeek').onclick=async()=>{await save();weekOffset=0;loadWeek()};
onAuthStateChanged(auth,user=>{if(!user){setStatus('Effettua prima il login dalla Dashboard.',false,true);return}ref=doc(db,'users',user.uid,'budgets',month);onSnapshot(ref,snap=>{const d=snap.exists()?snap.data().spesaSettimanale||{}:{};allWeeks=d.weeks&&typeof d.weeks==='object'?d.weeks:{};if(!Object.keys(allWeeks).length&&(d.food1||d.food2||d.pet1||d.pet2)){allWeeks[currentKey()]={food1:d.food1||[],food2:d.food2||[],pet1:d.pet1||[],pet2:d.pet2||[]}}loadWeek();setStatus('Sincronizzato con Firebase ✓',true)},e=>setStatus('Firebase non disponibile o permessi insufficienti',false,true))});
</script></body></html>
