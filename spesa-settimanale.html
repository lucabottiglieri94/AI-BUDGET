<!DOCTYPE html>
<html lang="it"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Spesa settimanale</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(135deg,#0b1020,#111827);color:#f1f3fa;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.top{display:flex;justify-content:space-between;align-items:center;padding:20px 28px;border-bottom:1px solid #293247;gap:15px;flex-wrap:wrap}.title{font-size:24px;font-weight:800}.sub,.muted,.hint{font-size:13px;color:#aeb6c9;margin-top:7px}.back,.weekbtn{border:1px solid #39445b;background:#202a3b;color:#eef2fb;padding:11px 16px;border-radius:12px;font-weight:700;cursor:pointer}.weeknav{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.weeklabel{min-width:190px;text-align:center;font-weight:800;background:#171f31;border:1px solid #39445b;padding:11px 14px;border-radius:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;padding:18px}.category{background:#0e1626;border:1px solid #2b354b;border-radius:20px;padding:16px}.cathead,.phead{display:flex;justify-content:space-between;align-items:center}.cathead{padding:4px 4px 14px;font-weight:800}.period{background:#1a2234;border:1px solid #354057;border-radius:16px;padding:18px;margin-top:14px}.phead{font-weight:800;margin-bottom:12px}.total{font-size:13px;color:#b9c1d2}.totalInput{width:100%;border:1px solid #46526b;background:#111827;color:#fff;border-radius:12px;padding:15px;font:inherit;font-size:20px;outline:none}.totalInput:focus{border-color:#8b5cf6;box-shadow:0 0 0 3px #8b5cf633}.status{text-align:center;color:#aeb6c9;font-size:12px;padding:12px}.ok{color:#37d98b}.err{color:#ff7186}@media(max-width:800px){.grid{grid-template-columns:1fr}.top{padding:16px}}</style></head><body><header class="top"><div><div class="title">🛒 Spesa settimanale</div><div class="sub">Inserisci direttamente il totale speso per ciascun periodo.</div></div><div class="weeknav"><button class="weekbtn" id="prevWeek">←</button><div class="weeklabel" id="weekLabel">Settimana corrente</div><button class="weekbtn" id="nextWeek">→</button><button class="weekbtn" id="todayWeek">Oggi</button><button class="back" onclick="location.href='index.html'">← Home</button></div></header><div id="status" class="status">Connessione a Firebase in corso...</div><main class="grid"><section class="category"><div class="cathead"><span>🧑‍🤝‍🧑 Luca e Lisa</span><span class="muted">Spese alimentari</span></div><div class="period"><div class="phead"><span>🗓️ Lunedì–Giovedì</span><span class="total" id="foodTotal1">€ 0,00</span></div><input class="totalInput" id="food1" type="number" min="0" step="0.01" placeholder="Totale"></div><div class="period"><div class="phead"><span>🗓️ Venerdì–Domenica</span><span class="total" id="foodTotal2">€ 0,00</span></div><input class="totalInput" id="food2" type="number" min="0" step="0.01" placeholder="Totale"></div></section><section class="category"><div class="cathead"><span>🐈 Gatti</span><span class="muted">Spese animali</span></div><div class="period"><div class="phead"><span>🗓️ Lunedì–Giovedì</span><span class="total" id="petTotal1">€ 0,00</span></div><input class="totalInput" id="pet1" type="number" min="0" step="0.01" placeholder="Totale"></div><div class="period"><div class="phead"><span>🗓️ Venerdì–Domenica</span><span class="total" id="petTotal2">€ 0,00</span></div><input class="totalInput" id="pet2" type="number" min="0" step="0.01" placeholder="Totale"></div></section></main><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';import{getAuth,onAuthStateChanged}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';import{getFirestore,doc,onSnapshot,setDoc}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';const cfg={apiKey:'AIzaSyAdZbBv6JYbYnl6CxuFVfHhSftvIxwf2DY',authDomain:'budget-luca.firebaseapp.com',projectId:'budget-luca',storageBucket:'budget-luca.firebasestorage.app',messagingSenderId:'67496424698',appId:'1:67496424698:web:b1822e04ef4efc07408543'};const app=initializeApp(cfg),auth=getAuth(app),db=getFirestore(app);let ref,allWeeks={},state={food1:'',food2:'',pet1:'',pet2:''},offset=0,timer;const ids=['food1','food2','pet1','pet2'],monthKey=new Date().toISOString().slice(0,7),$=id=>document.getElementById(id),money=n=>new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR'}).format(Number(n)||0);function monday(d){let x=new Date(d);x.setHours(0,0,0,0);let day=x.getDay()||7;x.setDate(x.getDate()-day+1);return x}function key(){let d=monday(new Date());d.setDate(d.getDate()+offset*7);return d.toISOString().slice(0,10)}function label(k){let a=new Date(k+'T00:00:00'),b=new Date(a);b.setDate(a.getDate()+6);return a.toLocaleDateString('it-IT')+' – '+b.toLocaleDateString('it-IT')}function load(){state=allWeeks[key()]||{food1:'',food2:'',pet1:'',pet2:''};$('weekLabel').textContent=(offset===0?'Settimana corrente · ':'')+label(key());ids.forEach(id=>{$(id).value=state[id]??'';$(id.replace('food','foodTotal').replace('pet','petTotal')).textContent=money(state[id])})}function update(id){state[id]=$(id).value;$(id.replace('food','foodTotal').replace('pet','petTotal')).textContent=money(state[id])}async function save(){if(!ref)return;allWeeks[key()]={...state};let f=+state.food1||0,g=+state.food2||0,p=+state.pet1||0,q=+state.pet2||0;try{await setDoc(ref,{spesaSettimanale:{weeks:allWeeks,activeWeek:key(),foodTotal:f+g,animalTotal:p+q,weeklyTotal:f+g+p+q,updatedAt:Date.now()}},{merge:true});setStatus('Salvato e sincronizzato con Firebase ✓',true)}catch(e){setStatus('Errore Firebase',false,true)}}function setStatus(t,ok,err){$('status').textContent=t;$('status').className='status '+(ok?'ok':err?'err':'')}ids.forEach(id=>{$(id).oninput=()=>update(id);$(id).onblur=()=>{clearTimeout(timer);timer=setTimeout(save,200)}});$('prevWeek').onclick=async()=>{await save();offset--;load()};$('nextWeek').onclick=async()=>{await save();offset++;load()};$('todayWeek').onclick=async()=>{await save();offset=0;load()};onAuthStateChanged(auth,u=>{if(!u){setStatus('Effettua prima il login dalla Dashboard.',false,true);return}ref=doc(db,'users',u.uid,'budgets',monthKey);onSnapshot(ref,s=>{let d=s.exists()?s.data().spesaSettimanale||{}:{};allWeeks=d.weeks&&typeof d.weeks==='object'?d.weeks:{};load();setStatus('Sincronizzato con Firebase ✓',true)},()=>setStatus('Firebase non disponibile',false,true))});</script></body></html>
