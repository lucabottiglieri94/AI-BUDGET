<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spesa settimanale</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top left,#17152e 0,#0b1020 45%,#070b15 100%);color:#f1f3fa;font-family:Montserrat,Arial,sans-serif}.top{display:flex;justify-content:space-between;align-items:center;padding:20px 28px;border-bottom:1px solid #293247;background:#111728cc}.title{font-size:24px;font-weight:800}.sub{font-size:13px;color:#aeb6c9;margin-top:8px;font-weight:600}.back{border:1px solid #39445b;background:#202a3b;color:#eef2fb;padding:14px 20px;border-radius:16px;font-weight:800;font-size:16px;cursor:pointer}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;padding:18px}.category{background:#0e1626;border:1px solid #2b354b;border-radius:20px;padding:12px 12px 16px}.cathead{display:flex;justify-content:space-between;align-items:center;padding:8px 6px 14px;font-weight:800}.muted{font-size:12px;color:#aeb6c9}.period{background:#1a2234;border:1px solid #354057;border-radius:20px;padding:16px;margin-top:14px}.phead{display:flex;justify-content:space-between;align-items:center;font-weight:800;margin-bottom:14px}.total{font-size:13px;color:#b9c1d2}.products{display:flex;flex-direction:column;gap:8px}.row{display:grid;grid-template-columns:1fr 125px 42px;gap:8px}.row input{width:100%;border:1px solid #46526b;background:#0d1423;color:white;border-radius:10px;padding:11px;font:inherit;font-size:13px;outline:none}.row input:focus{border-color:#38c8f0}.del{border:0;border-radius:10px;background:#3a2030;color:#ff8da8;font-size:18px;cursor:pointer}.add{width:100%;margin-top:12px;border:0;border-radius:16px;padding:15px;background:linear-gradient(100deg,#20c96a,#2eb8ef);color:#08111c;font-weight:800;font-size:18px;cursor:pointer}.animal .add{background:linear-gradient(100deg,#f13f4c,#8c35ed)}.status{text-align:center;color:#aeb6c9;font-size:12px;padding:0 0 14px}.status.ok{color:#37d98b}.status.err{color:#ff7186}@media(max-width:800px){.grid{grid-template-columns:1fr}.top{padding:16px;align-items:flex-start;gap:12px}.title{font-size:19px}.back{font-size:12px;padding:11px}}
</style>
</head>
<body>
<header class="top"><div><div class="title">🛒 Spesa settimanale</div><div class="sub">Inserisci le spese una sola volta: i totali si sincronizzano con la home.</div></div><button class="back" onclick="location.href='index.html'">← Torna alla home</button></header>
<div id="status" class="status">Connessione a Firebase in corso...</div>
<main class="grid">
<section class="category"><div class="cathead"><span>🧑‍🤝‍🧑 Luca e Lisa</span><span class="muted">Spese alimentari</span></div><div class="period"><div class="phead"><span>🗓️ Lunedì–Giovedì</span><span class="total" id="foodTotal1">€ 0,00</span></div><div class="products" id="food1"></div><button class="add" onclick="addProduct('food1')">+ Aggiungi prodotto</button></div><div class="period"><div class="phead"><span>🗓️ Venerdì–Domenica</span><span class="total" id="foodTotal2">€ 0,00</span></div><div class="products" id="food2"></div><button class="add" onclick="addProduct('food2')">+ Aggiungi prodotto</button></div></section>
<section class="category animal"><div class="cathead"><span>🐈 Gatti</span><span class="muted">Spese animali</span></div><div class="period"><div class="phead"><span>🗓️ Lunedì–Giovedì</span><span class="total" id="petTotal1">€ 0,00</span></div><div class="products" id="pet1"></div><button class="add" onclick="addProduct('pet1')">+ Aggiungi prodotto</button></div><div class="period"><div class="phead"><span>🗓️ Venerdì–Domenica</span><span class="total" id="petTotal2">€ 0,00</span></div><div class="products" id="pet2"></div><button class="add" onclick="addProduct('pet2')">+ Aggiungi prodotto</button></div></section>
</main>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import {getAuth,onAuthStateChanged} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import {getFirestore,doc,onSnapshot,setDoc} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
const firebaseConfig={apiKey:'AIzaSyAdZbBv6JYbYnl6CxuFVfHhSftvIxwf2DY',authDomain:'budget-luca.firebaseapp.com',projectId:'budget-luca',storageBucket:'budget-luca.firebasestorage.app',messagingSenderId:'67496424698',appId:'1:67496424698:web:b1822e04ef4efc07408543',measurementId:'G-7LEYRZE9QN'};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);let ref=null, state={food1:[],food2:[],pet1:[],pet2:[]}, timer;
const statusEl=document.getElementById('status'); const month=localStorage.getItem('budgetMonth')||new Date().toISOString().slice(0,7);
const money=n=>new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR'}).format(Number(n)||0);
function setStatus(t,ok=false,err=false){statusEl.textContent=t;statusEl.className='status'+(ok?' ok':'')+(err?' err':'')}
function clean(v){return String(v??'').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function render(key){const el=document.getElementById(key);el.innerHTML='';(state[key]||[]).forEach((p,i)=>{const row=document.createElement('div');row.className='row';row.innerHTML=`<input class="pname" data-key="${key}" data-i="${i}" value="${clean(p.name)}" placeholder="Nome prodotto"><input class="pprice" type="number" min="0" step="0.01" data-key="${key}" data-i="${i}" value="${p.price??''}" placeholder="€ 0,00"><button class="del" data-key="${key}" data-i="${i}">×</button>`;el.appendChild(row)});document.getElementById(key==='food1'?'foodTotal1':key==='food2'?'foodTotal2':key==='pet1'?'petTotal1':'petTotal2').textContent=money((state[key]||[]).reduce((s,p)=>s+(Number(p.price)||0),0))}
function renderAll(){['food1','food2','pet1','pet2'].forEach(render)}
window.addProduct=key=>{state[key].push({name:'',price:''});renderAll();scheduleSave();setTimeout(()=>document.querySelector(`#${key} .pname:last-child`)?.focus(),50)};
document.addEventListener('input',e=>{if(!e.target.matches('.pname,.pprice'))return;const k=e.target.dataset.key,i=Number(e.target.dataset.i);if(!state[k][i])return;if(e.target.classList.contains('pname'))state[k][i].name=e.target.value;else state[k][i].price=e.target.value;render(k);scheduleSave()});
document.addEventListener('click',e=>{if(!e.target.matches('.del'))return;const k=e.target.dataset.key,i=Number(e.target.dataset.i);state[k].splice(i,1);renderAll();scheduleSave()});
function scheduleSave(){clearTimeout(timer);timer=setTimeout(save,350)}
async function save(){if(!ref)return;try{const foodPeriod1=state.food1.reduce((s,p)=>s+(Number(p.price)||0),0),foodPeriod2=state.food2.reduce((s,p)=>s+(Number(p.price)||0),0),petPeriod1=state.pet1.reduce((s,p)=>s+(Number(p.price)||0),0),petPeriod2=state.pet2.reduce((s,p)=>s+(Number(p.price)||0),0);await setDoc(ref,{spesaSettimanale:{food1:state.food1,food2:state.food2,pet1:state.pet1,pet2:state.pet2,period1:foodPeriod1,period2:foodPeriod2,petPeriod1,petPeriod2,updatedAt:Date.now()}},{merge:true});setStatus('Salvataggio automatico attivo ✓',true)}catch(e){console.error(e);setStatus('Errore nel salvataggio Firebase',false,true)}}
onAuthStateChanged(auth,user=>{if(!user){setStatus('Effettua il login dalla Dashboard per usare la sincronizzazione.',false,true);return}ref=doc(db,'users',user.uid,'budgets',month);onSnapshot(ref,snap=>{const d=snap.exists()?snap.data().spesaSettimanale||{}:{};state={food1:Array.isArray(d.food1)?d.food1:[],food2:Array.isArray(d.food2)?d.food2:[],pet1:Array.isArray(d.pet1)?d.pet1:[],pet2:Array.isArray(d.pet2)?d.pet2:[]};renderAll();setStatus('Sincronizzato con Firebase ✓',true)},e=>{console.error(e);setStatus('Firebase non disponibile o permessi insufficienti',false,true)})});
</script>
</body></html>
