<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI-BUDGET | Consumi Smart</title>
</head>
<body>
<p style="font-family:Arial;padding:20px">Caricamento Consumi Smart…</p>
<script>
(async()=>{
  const u='https://raw.githubusercontent.com/lucabottiglieri94/AI-BUDGET/fee9e9fca55d47c94c69f8ca61208f88af41498c/consumi.html';
  let s=await (await fetch(u,{cache:'no-store'})).text();
  
  // 1. MANTIENE IL CANONE RAI NEL DOM PER NON ROMPERE I CALCOLI ORIGINALI
  // Viene reso in sola lettura e bloccato a 18€, così il tuo script può leggerlo senza errori.
  s=s.replace('<label>Canone RAI (€)<input id="billRai" type="number" step="0.01" value="0" placeholder="0.00"></label>',
              '<label>Canone RAI (€) [Automatico]<input id="billRai" type="number" step="0.01" value="18" readonly style="background-color: #f0f0f0;"></label>');
              
  // 2. Tendina del bimestre che aggiorna automaticamente il Canone RAI (a 0 solo per Nov-Dic) e fa ripartire il ricalcolo
  s=s.replace('<label>Periodo bolletta<input id="billPeriod" type="text" placeholder="Luglio - Agosto 2026"></label>',
              '<label>Bimestre bolletta<select id="billPeriod" onchange="document.getElementById(\'billRai\').value = (this.value === \'Novembre - Dicembre\') ? 0 : 18; document.getElementById(\'billTotal\').dispatchEvent(new Event(\'input\'));"><option>Gennaio - Febbraio</option><option>Marzo - Aprile</option><option>Maggio - Giugno</option><option>Luglio - Agosto</option><option>Settembre - Ottobre</option><option>Novembre - Dicembre</option></select></label>');

  // 3. Rinominato per prendere solo i kWh del singolo bimestre, non quelli annui
  s=s.replace('kWh fatturati', 'kWh del bimestre');
  
  // 4. Testo informativo aggiornato con la tua esatta logica
  s=s.replace('Il calcolo esclude il Canone RAI e divide la spesa rimanente in due per la quota personale.',
              'Logica: (Totale fatturato del bimestre − Canone RAI) ÷ 2 = Quota da pagare. La tariffa unitaria si calcola sui kW del bimestre.');
  s=s.replace('Totale escluso Canone RAI','Totale netto bolletta');
  s=s.replace('Quota personale divisa per 2','Quota personale da pagare (Netto ÷ 2)');

  document.open();
  document.write(s);
  document.close();
})().catch(e=>document.body.innerHTML='<p style="font-family:Arial;padding:20px">Errore caricamento pagina: '+e.message+'</p>');
</script>
</body>
</html>
