<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI-BUDGET | Consumi Smart</title>
</head>
<body>
<p style="font-family:Arial;padding:20px">Caricamento Consumi Smart…</p>
<script>
(async()=>{
  const u='https://raw.githubusercontent.com/lucabottiglieri94/AI-BUDGET/fee9e9fca55d47c94c69f8ca61208f88af41498c/consumi.html';
  let s=await (await fetch(u,{cache:'no-store'})).text();
  
  // 1. NASCONDO il Canone RAI anziché cancellarlo, così il tuo sistema originale non va in errore e completa i calcoli
  s=s.replace('<label>Canone RAI (€)<input id="billRai" type="number" step="0.01" value="0" placeholder="0.00"></label>',
              '<div style="display:none;"><label>Canone RAI (€)<input id="billRai" type="number" step="0.01" value="18" placeholder="0.00"></label></div>');
              
  // 2. Inserisco la tendina del Bimestre. Quando cambia, aggiorna di nascosto il Canone RAI e ricalcola
  s=s.replace('<label>Periodo bolletta<input id="billPeriod" type="text" placeholder="Luglio - Agosto 2026"></label>',
              '<label>Bimestre bolletta<select id="billPeriod" onchange="document.getElementById(\\'billRai\\').value = (this.value === \\'Novembre - Dicembre\\') ? 0 : 18; document.getElementById(\\'billKwh\\').dispatchEvent(new Event(\\'input\\'));"><option>Gennaio - Febbraio</option><option>Marzo - Aprile</option><option>Maggio - Giugno</option><option>Luglio - Agosto</option><option>Settembre - Ottobre</option><option>Novembre - Dicembre</option></select></label>');

  // 3. Rinomino i kWh e rimuovo l'eventuale numero annuo fuorviante (2125)
  s=s.replace('kWh fatturati', 'kWh del bimestre');
  s=s.replace('placeholder="2125"', 'placeholder="Es. 350"');
  s=s.replace('value="2125"', 'value=""');

  // 4. Testi descrittivi sistemati per riflettere la tua esatta logica
  s=s.replace('Il calcolo esclude il Canone RAI e divide la spesa rimanente in due per la quota personale.',
              'Logica: (Totale bolletta − 18€ Canone RAI) ÷ 2 = Quota da pagare. La tariffa è calcolata sul totale netto.');
  s=s.replace('Totale escluso Canone RAI','Totale netto bolletta');
  s=s.replace('Quota personale divisa per 2','Quota personale da pagare (Netto ÷ 2)');

  // 5. Inizializzo forzatamente il valore del Canone a 18 all'avvio per assicurare la correttezza del primo calcolo
  s += `
  <script>
      setTimeout(() => {
          let rai = document.getElementById('billRai');
          if(rai && rai.value === "0") { rai.value = "18"; }
      }, 500);
  <\/script>
  `;

  document.open();
  document.write(s);
  document.close();
})().catch(e=>document.body.innerHTML='<p style="font-family:Arial;padding:20px">Errore caricamento pagina: '+e.message+'</p>');
</script>
</body>
</html>
