<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI-BUDGET | Consumi Smart</title>
</head>
<body>
<p style="font-family:Arial;padding:20px">Caricamento Consumi Smart…</p>
<script>
(async()=>{
  const u='https://raw.githubusercontent.com/lucabottiglieri94/AI-BUDGET/fee9e9fca55d47c94c69f8ca61208f88af41498c/consumi.html';
  let s=await (await fetch(u,{cache:'no-store'})).text();
  
  // Nascondo il Canone RAI per non rompere il calcolo originale
  s=s.replace('<label>Canone RAI (€)<input id="billRai" type="number" step="0.01" value="0" placeholder="0.00"></label>',
              '<div style="display:none;"><label>Canone RAI (€)<input id="billRai" type="number" step="0.01" value="18" placeholder="0.00"></label></div>');
              
  // Aggiungo la tendina che aggiorna il canone e ricalcola
  s=s.replace('<label>Periodo bolletta<input id="billPeriod" type="text" placeholder="Luglio - Agosto 2026"></label>',
              '<label>Bimestre bolletta<select id="billPeriod" onchange="const r=document.getElementById(\'billRai\'); if(r){r.value=(this.value===\'Novembre - Dicembre\')?0:18; const k=document.getElementById(\'billKwh\'); if(k)k.dispatchEvent(new Event(\'input\'));}"><option>Gennaio - Febbraio</option><option>Marzo - Aprile</option><option>Maggio - Giugno</option><option>Luglio - Agosto</option><option>Settembre - Ottobre</option><option>Novembre - Dicembre</option></select></label>');

  // Rinomino i kWh del bimestre e rimuovo il placeholder annuo (2125)
  s=s.replace('kWh fatturati', 'kWh del bimestre');
  s=s.replace('placeholder="2125"', 'placeholder="Es. 350"');

  // Aggiorno le etichette con la tua logica
  s=s.replace('Il calcolo esclude il Canone RAI e divide la spesa rimanente in due per la quota personale.',
              'Logica: (Totale bolletta − 18€ Canone RAI) ÷ 2 = Quota da pagare. La tariffa è calcolata sul totale netto.');
  s=s.replace('Totale escluso Canone RAI','Totale netto bolletta');
  s=s.replace('Quota personale divisa per 2','Quota personale da pagare (Netto ÷ 2)');

  // Questa riga forza il calcolo iniziale se ci sono già dei valori
  s=s.replace("document.getElementById('billTotal').addEventListener('input', calculateBill);",
              "document.getElementById('billTotal').addEventListener('input', calculateBill); setTimeout(()=>{const r=document.getElementById('billRai'); if(r && r.value==='0') r.value='18'; calculateBill();}, 300);");

  document.open();
  document.write(s);
  document.close();
})().catch(e=>document.body.innerHTML='<p style="font-family:Arial;padding:20px">Errore caricamento pagina: '+e.message+'</p>');
</script>
</body>
</html>
