<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI-BUDGET | Consumi Smart</title>
</head>
<body>
<p style="font-family:Arial;padding:20px">Caricamento Consumi Smart…</p>
<script>
(async()=>{
  const u='https://raw.githubusercontent.com/lucabottiglieri94/AI-BUDGET/fee9e9fca55d47c94c69f8ca61208f88af41498c/consumi.html';
  let s=await (await fetch(u,{cache:'no-store'})).text();
  
  // 1. ELIMINO COMPLETAMENTE L'INPUT DEL CANONE RAI VISIVO (non apparirà più)
  s=s.replace('<label>Canone RAI (€)<input id="billRai" type="number" step="0.01" value="0" placeholder="0.00"></label>','');
  
  // 2. INSERISCO LA TENDINA BIMESTRE CON TRIGGER AUTOMATICO AL CAMBIO
  s=s.replace('<label>Periodo bolletta<input id="billPeriod" type="text" placeholder="Luglio - Agosto 2026"></label>',
    '<label>Bimestre bolletta<select id="billPeriod" onchange="document.getElementById(\'billTotal\').dispatchEvent(new Event(\'input\'))">' +
    '<option>Gennaio - Febbraio</option>' +
    '<option>Marzo - Aprile</option>' +
    '<option>Maggio - Giugno</option>' +
    '<option>Luglio - Agosto</option>' +
    '<option>Settembre - Ottobre</option>' +
    '<option>Novembre - Dicembre</option>' +
    '</select></label>');
    
  // 3. SISTEMO LE ETICHETTE (kWh del bimestre invece di fatturati)
  s=s.replace('kWh fatturati', 'kWh del bimestre');
  s=s.replace('Totale escluso Canone RAI', 'Totale netto bolletta');
  s=s.replace('Quota personale divisa per 2', 'Quota personale da pagare (Netto ÷ 2)');
  s=s.replace('Il calcolo esclude il Canone RAI e divide la spesa rimanente in due per la quota personale.', 
    'Logica applicata: (Totale Bimestre − Canone RAI automatico) ÷ 2 = Quota da pagare. Il prezzo unitario è Netto ÷ kWh del bimestre.');
  
  // 4. INIETTO LA LOGICA MATEMATICA CORRETTA DIRETTAMENTE NELLE VARIABILI DELLO SCRIPT
  // Calcola 18€ se non è Nov-Dic. Tutto il calcolo su netto, tariffa e quota funzionerà in automatico.
  s=s.replace(
    "const total=Number($('billTotal').value)||0,rai=Number($('billRai').value)||0,kwh=Number($('billKwh').value)||0;",
    "const total=Number($('billTotal').value)||0, kwh=Number($('billKwh').value)||0; const sel=document.getElementById('billPeriod'); const rai=(sel && sel.value==='Novembre - Dicembre') ? 0 : 18;"
  );
  
  // 5. RIMUOVO LA RIGA CHE BLOCCAVA I CALCOLI A 0 (perché cercava l'input RAI che abbiamo eliminato)
  s=s.replace("$('billRai').value=rai||0;", '');

  document.open();
  document.write(s);
  document.close();
})().catch(e=>document.body.innerHTML='<p style="font-family:Arial;padding:20px">Errore caricamento pagina: '+e.message+'</p>');
</script>
</body>
</html>
