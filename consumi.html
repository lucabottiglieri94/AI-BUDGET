<!doctype html>
<html lang="it">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>AI-BUDGET | Consumi Smart</title>
</head>
<body>
    <p style="font-family:Arial;padding:20px">Caricamento Consumi Smart…</p>
    <script>
        (async () => {
            try {
                const u = 'https://raw.githubusercontent.com/lucabottiglieri94/AI-BUDGET/fee9e9fca55d47c94c69f8ca61208f88af41498c/consumi.html';
                let s = await (await fetch(u, { cache: 'no-store' })).text();
                
                s = s.replace(/<label>Canone RAI \(€\)[\s\S]*?<\/label>/, '');
                s = s.replace(/<label>Periodo bolletta[\s\S]*?<\/label>/, '<label>Bimestre bolletta<select id="billPeriod"><option>Gennaio - Febbraio</option><option>Marzo - Aprile</option><option>Maggio - Giugno</option><option>Luglio - Agosto</option><option>Settembre - Ottobre</option><option>Novembre - Dicembre</option></select></label>');
                s = s.replace(/Il calcolo esclude il Canone RAI e divide la spesa rimanente in due per la quota personale\./, 'Il Canone RAI fisso di 18 € viene escluso. Totale netto = totale − 18 €. Quota personale = totale netto ÷ 2. Tariffa = totale fatturato ÷ kWh del periodo.');
                s = s.replace('Totale escluso Canone RAI', 'Totale netto bolletta (−18 € RAI)');
                s = s.replace('Quota personale divisa per 2', 'Quota personale da pagare (netto ÷ 2)');
                s = s.replace(/<div class="row"><span class="muted">Costo attuale stimato<\/span>[\s\S]*?<\/div>/, '');
                s = s.replace(/const total=Number\(\$\('billTotal'\)\.value\)\|\|0,rai=Number\(\$\('billRai'\)\.value\)\|\|0,kwh=Number\(\$\('billKwh'\)\.value\)\|\|0;/, "const total=Number($('billTotal').value)||0,kwh=Number($('billKwh').value)||0,rai=18;");
                s = s.replace("$('billRai').value=rai||0;", '');
                s = s.replace(/function extractField\([\s\S]*?async function extractBillText/, "function extractField(text,patterns){for(const p of patterns){const m=text.match(p);if(m){const n=parseItalianNumber(m[1]);if(n)return n}}return 0}async function extractBillText");
                
                const a = s.indexOf("$('billFile').onchange=async()=>");
                const b = s.indexOf("$('saveBill').onclick", a);
                
                if (a > 0 && b > a) {
                    // Stringa appiattita per non rompere il parse di Javascript (risolve il blocco Tuya)
                    const logic = "$('billFile').onchange=async()=>{try{const f=$('billFile').files[0];$('billStatus').innerHTML='<div style=\"padding:15px; border-radius:12px; background:rgba(2,132,199,0.1); border:1px solid rgba(2,132,199,0.2); color:#0284c7; text-align:center; font-weight:bold;\">✨ Lettura IA in corso... ⏳</div>';const text=await extractBillText(f);let total=0,kwh=0,aiSuccess=false;const systemPrompt='Sei un analista dati specializzato nelle bollette Eni Plenitude. Devi estrarre DUE soli valori: 1. Il Totale da pagare. 2. Il Consumo del periodo in kWh (ignora CATEGORICAMENTE il consumo annuo). Restituisci SOLO un JSON: {\"totale\": 235.76, \"kwh\": 802}';const apiKey=localStorage.getItem('gemini_api_key')||localStorage.getItem('geminiApiKey')||localStorage.getItem('apiKey')||'';if(apiKey&&apiKey.length>10){try{const resp=await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key='+apiKey,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{parts:[{text:systemPrompt+\"\\n\\nTESTO:\\n\"+String(text).substring(0,10000)}]}]})});const jsonResp=await resp.json();if(jsonResp.candidates&&jsonResp.candidates[0].content){const aiText=jsonResp.candidates[0].content.parts[0].text;const jsonMatch=aiText.match(/\\{[\\s\\S]*?\\}/);if(jsonMatch){const data=JSON.parse(jsonMatch[0]);total=Number(data.totale)||0;kwh=Number(data.kwh)||0;if(total>0&&kwh>0)aiSuccess=true;}}}catch(err){console.log(err);}}if(!total||!kwh){const clean=String(text).replace(/\\u00a0/g,' ').replace(/\\s+/g,' ');const num=x=>{let v=String(x).trim().replace(/\\.(?=\\d{3}(?:\\D|$))/g,'').replace(',','.');return Number(v)||0};const find=patterns=>{for(const r of patterns){const m=clean.match(r);if(m){const v=num(m[1]);if(v>0)return v}}return 0};total=total||find([/totale\\s+da\\s+pagare\\s+entro\\s+il\\s+\\d{2}\\/\\d{2}\\/\\d{4}\\s*(\\d{1,5},\\d{2})/i,/totale\\s+da\\s+pagare[^\\d]{0,20}(\\d{1,5},\\d{2})/i,/totale\\s+bolletta[^\\d]{0,20}(\\d{1,5},\\d{2})/i]);kwh=kwh||find([/consumo\\s+del\\s+periodo\\s+di\\s+fatturazione\\s*(\\d{1,5}(?:[.,]\\d{1,3})?)\\s*kwh/i,/consumo\\s+fatturato[^\\d]{0,20}(\\d{1,5}(?:[.,]\\d{1,3})?)/i,/(\\d{1,5}(?:[.,]\\d{1,3})?)\\s*kwh\\b(?![^.]{0,30}(?:annuo|annuale|12\\s*mesi|anno))/i]);}if(!total||!kwh)throw Error('Dati bolletta non trovati.');const costoKwh=total/kwh;const quotaMia=(total-18)/2;$('billTotal').value=total||'';$('billKwh').value=kwh||'';$('billStatus').innerHTML='<div style=\"margin-top:20px; padding:20px; background:linear-gradient(145deg, #ffffff, #f8fafc); border:1px solid #cbd5e1; border-radius:16px; box-shadow: 0 4px 15px rgba(0,0,0,0.03);\"><h4 style=\"margin:0 0 15px 0; color:#0f172a;\">'+(aiSuccess?'✨ Elaborato con AI':'✅ Bolletta Analizzata')+'</h4><div style=\"display:flex; flex-direction:column; gap:12px; color:#475569; font-size:15px;\"><div style=\"display:flex; justify-content:space-between; padding-bottom:8px; border-bottom:1px solid #e2e8f0;\"><span>Consumo Bimestre:</span><strong style=\"color:#0f172a;\">'+kwh+' kWh</strong></div><div style=\"display:flex; justify-content:space-between; padding-bottom:8px; border-bottom:1px solid #e2e8f0;\"><span>Tariffa Applicata:</span><strong style=\"color:#0f172a;\">€ '+costoKwh.toFixed(3)+'/kWh</strong></div><div style=\"display:flex; justify-content:space-between; padding-top:8px; align-items:center;\"><span style=\"font-size:0.9em;\">Quota da Pagare<br><small>(Totale - 18€ ÷ 2)</small></span><strong style=\"color:#0284c7; font-size:22px; font-weight:800;\">€ '+quotaMia.toFixed(2)+'</strong></div></div></div>';}catch(e){$('billStatus').innerHTML='<div style=\"padding:15px; border-radius:12px; background:#fef2f2; border:1px solid #fecaca; color:#ef4444; font-weight:bold;\">❌ Errore lettura PDF: '+e.message+'</div>';alert(e.message);}};";
                    
                    s = s.slice(0, a) + logic + s.slice(b);
                }
                
                s = s.replace(/const share=total\/2;settings=\{\.\.\.settings,billTotal:total,billRai:0,billKwh:kwh,billNet:share,billShare:share,kwhRate:share\/kwh,billPeriod:\$\('billPeriod'\)\.value\.trim\(\)\};/, "const rai=18,net=Math.max(0,total-rai),share=net/2;settings={...settings,billTotal:total,billRai:rai,billKwh:kwh,billNet:net,billShare:share,kwhRate:total/kwh,billPeriod:$('billPeriod').value};");
                
                // Stile iniettato in modo sicuro alla fine, senza toccare <head>
                const smartStyle = "<style>#billPeriod, #billFile, #billTotal, #billKwh, #billRai { background: rgba(255, 255, 255, 0.7); border: 1px solid #cbd5e1; border-radius: 12px; padding: 12px 16px; width: 100%; color: #1e293b; font-family: inherit; font-size: 15px; margin-top: 6px; box-sizing: border-box; transition: all 0.3s ease; } #billPeriod:focus, #billFile:focus, #billTotal:focus, #billKwh:focus { border-color: #0284c7; box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15); outline: none; } #saveBill { background: linear-gradient(135deg, #0284c7, #0369a1); border: none; border-radius: 12px; color: white; padding: 15px 20px; font-size: 16px; font-weight: 600; cursor: pointer; transition: transform 0.2s ease; width: 100%; margin-top: 20px; } #saveBill:hover { transform: translateY(-2px); } label { font-weight: 600; font-size: 0.9em; color: #64748b; display: block; margin-top: 16px; }</style>";
                s = s + smartStyle;
                
                document.open();
                document.write(s);
                document.close();
            } catch (e) {
                document.body.innerHTML = '<p style="font-family:Arial;padding:20px">Errore caricamento pagina: ' + e.message + '</p>';
            }
        })();
    </script>
</body>
</html>
