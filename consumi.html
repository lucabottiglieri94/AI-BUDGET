<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI-BUDGET | Consumi Smart</title></head><body><p style="font-family:Arial;padding:20px">Caricamento Consumi Smart…</p><script>(async()=>{const u='https://raw.githubusercontent.com/lucabottiglieri94/AI-BUDGET/fee9e9fca55d47c94c69f8ca61208f88af41498c/consumi.html';let s=await (await fetch(u,{cache:'no-store'})).text();s=s.replace('<label>Canone RAI (€)<input id="billRai" type="number" step="0.01" value="0" placeholder="0.00"></label>','');s=s.replace('Il calcolo esclude il Canone RAI e divide la spesa rimanente in due per la quota personale.','Calcolo: totale bolletta meno 18 € di Canone RAI, poi divisione della quota personale per 2.');s=s.replace('Totale escluso Canone RAI','Quota personale: (totale − 18 €) ÷ 2');s=s.replace("const total=Number($('billTotal').value)||0,rai=Number($('billRai').value)||0,kwh=Number($('billKwh').value)||0;","const total=Number($('billTotal').value)||0,kwh=Number($('billKwh').value)||0;");s=s.replace('const share=total/2;','const rai=18,net=Math.max(0,total-rai),share=net/2;');s=s.replace("settings={...settings,billTotal:total,billRai:0,billKwh:kwh,billNet:share,billShare:share,kwhRate:share/kwh,billPeriod:$('billPeriod').value.trim()}","settings={...settings,billTotal:total,billRai:rai,billKwh:kwh,billNet:net,billShare:share,kwhRate:net/kwh,billPeriod:$('billPeriod').value.trim()}");document.open();document.write(s);document.close()})().catch(e=>document.body.innerHTML='<p style="font-family:Arial;padding:20px">Errore caricamento pagina: '+e.message+'</p>');</script></body></html>
