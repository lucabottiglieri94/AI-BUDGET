<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI-BUDGET | Consumi Smart</title></head><body><p style="font-family:Arial;padding:20px">Caricamento Consumi Smart…</p><script>(async()=>{const u='https://raw.githubusercontent.com/lucabottiglieri94/AI-BUDGET/fee9e9fca55d47c94c69f8ca61208f88af41498c/consumi.html';let s=await (await fetch(u,{cache:'no-store'})).text();s=s.replace('<label>Canone RAI (€)<input id="billRai" type="number" step="0.01" value="0" placeholder="0.00"></label>','');s=s.replace('<label>Periodo bolletta<input id="billPeriod" type="text" placeholder="Luglio - Agosto 2026"></label>','<label>Bimestre bolletta<select id="billPeriod"><option>Gennaio - Febbraio</option><option>Marzo - Aprile</option><option>Maggio - Giugno</option><option>Luglio - Agosto</option><option>Settembre - Ottobre</option><option>Novembre - Dicembre</option></select></label>');s=s.replace('Il calcolo esclude il Canone RAI e divide la spesa rimanente in due per la quota personale.','Calcolo automatico: totale bolletta − 18 € Canone RAI. La quota personale da pagare è il totale netto diviso 2.');s=s.replace('Totale escluso Canone RAI','Totale netto bolletta');s=s.replace('Quota personale divisa per 2','Quota personale da pagare (netto ÷ 2)');s=s.replace('const total=Number($(\'billTotal\').value)||0,rai=Number($(\'billRai\').value)||0,kwh=Number($(\'billKwh\').value)||0;','const total=Number($(\'billTotal\').value)||0,kwh=Number($(\'billKwh\').value)||0,rai=18;');s=s.replace("$('billRai').value=rai||0;",'');document.open();document.write(s);document.close()})().catch(e=>document.body.innerHTML='<p style="font-family:Arial;padding:20px">Errore caricamento pagina: '+e.message+'</p>');</script></body></html>
